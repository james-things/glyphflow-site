<style>
  :root {
    --fg: #e6ecef; --fg-muted: #9fb0b8; --accent: #8fd0dc;
    --panel: rgba(10, 16, 20, 0.78); --panel-line: rgba(230, 236, 239, 0.14);
    --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: #0c1114; color: var(--fg); font-family: var(--font-mono); overflow: hidden; -webkit-tap-highlight-color: transparent; }
  #sea { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .panel {
    position: fixed; z-index: 5;
    right: calc(12px + env(safe-area-inset-right, 0px));
    top: calc(12px + env(safe-area-inset-top, 0px));
    width: min(300px, calc(100vw - 24px)); max-height: min(62vh, calc(100vh - 24px)); overflow: auto;
    background: var(--panel); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border: 1px solid var(--panel-line); border-radius: 8px; font-size: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.28);
    transition: opacity 0.25s ease;
  }
  .panel summary { cursor: pointer; padding: 10px 12px; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; user-select: none; position: sticky; top: 0; background: var(--panel); z-index: 1; }
  .panel summary::-webkit-details-marker { display: none; }
  .panel summary .name { font-weight: 500; letter-spacing: 0.04em; }
  .panel summary .pill { display: none; font-size: 20px; line-height: 1; color: var(--accent); }
  .panel summary .close { color: var(--fg-muted); font-size: 14px; }
  .panel:not([open]) { width: 40px; height: 40px; border-radius: 999px; overflow: hidden; opacity: 0.72; }
  .panel:not([open]):hover { opacity: 1; }
  .panel:not([open]) summary { padding: 0; height: 40px; justify-content: center; }
  .panel:not([open]) summary .name, .panel:not([open]) summary .close { display: none; }
  .panel:not([open]) summary .pill { display: block; }
  body.hideui .panel { opacity: 0; pointer-events: none; }

  .body { display: grid; gap: 7px; padding: 6px 12px 12px; border-top: 1px solid var(--panel-line); }
  .group { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); padding-top: 8px; }
  .row { display: grid; grid-template-columns: 86px 1fr 42px; align-items: center; gap: 8px; }
  .row label { color: var(--fg-muted); }
  .row output { text-align: right; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
  .row input[type="range"] { width: 100%; margin: 0; accent-color: var(--accent); min-width: 0; }
  .row select { font: inherit; font-size: 12px; padding: 4px 6px; border: 1px solid var(--panel-line); border-radius: 5px; background: rgba(255,255,255,0.04); color: var(--fg); grid-column: 2 / 4; min-width: 0; }
  .row.check { grid-template-columns: 1fr auto; }
  .row.check input { accent-color: var(--accent); }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .seg label { position: relative; text-align: center; padding: 5px 0; border: 1px solid var(--panel-line); border-radius: 5px; color: var(--fg-muted); cursor: pointer; }
  .seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .seg input:checked + span { color: var(--fg); }
  .seg label:has(input:checked) { border-color: var(--accent); background: rgba(143, 208, 220, 0.12); }
  .seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; padding-top: 4px; }
  .btn { font: inherit; font-size: 12px; padding: 5px 9px; border: 1px solid var(--panel-line); border-radius: 5px; background: rgba(255,255,255,0.04); color: var(--fg); cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .panel :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint { color: var(--fg-muted); font-size: 11px; line-height: 1.45; padding-top: 6px; }
  .hint a { color: var(--accent); text-decoration: none; }
  .toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--panel); border: 1px solid var(--panel-line); color: var(--fg); padding: 7px 12px; border-radius: 6px; font-size: 12px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 6; }
  .toast.show { opacity: 1; }
  .nogl { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--fg-muted); font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>
<canvas id="sea" aria-label="A slow sea drawn in text"></canvas>
<div class="nogl" id="nogl" hidden>This page needs a recent browser with WebGL 2.</div>

<details class="panel" id="panel">
  <summary><span class="name">Glyphflow</span><span class="pill" aria-label="Open controls">≋</span><span class="close" aria-hidden="true">×</span></summary>
  <div class="body">
    <div class="group">Time</div>
    <div class="seg" role="radiogroup" aria-label="Time of day">
      <label><input type="radio" name="tmode" value="clock" checked><span>Clock</span></label>
      <label><input type="radio" name="tmode" value="lapse"><span>Time-lapse</span></label>
      <label><input type="radio" name="tmode" value="hold"><span>Hold</span></label>
    </div>
    <div class="row"><label for="hour">Hour</label><input type="range" id="hour" min="0" max="24" step="0.05" value="12"><output id="hour-o">12:00</output></div>
    <div class="group">Sea</div>
    <div class="row"><label for="seaState">Sea state</label><input type="range" id="seaState" min="0" max="1" step="0.02" value="0.4"><output id="seaState-o">0.40</output></div>
    <div class="group">Sky</div>
    <div class="row"><label for="cloud">Cloud cover</label><input type="range" id="cloud" min="0" max="1" step="0.05" value="0.45"><output id="cloud-o">0.45</output></div>
    <div class="row"><label for="hiType">High</label>
      <select id="hiType"><option value="0">None</option><option value="1" selected>Cirrus wisps</option><option value="2">Mackerel sky</option><option value="3">Cirrostratus veil</option></select></div>
    <div class="row"><label for="loType">Low</label>
      <select id="loType"><option value="0">None</option><option value="1" selected>Fair-weather cumulus</option><option value="2">Stratocumulus rolls</option><option value="3">Stratus sheet</option><option value="4">Towering cumulus</option></select></div>
    <div class="row check"><label for="drift">Clouds drift</label><input type="checkbox" id="drift" checked></div>
    <div class="group">Text</div>
    <div class="row"><label for="glyphset">Glyphs</label>
      <select id="glyphset"><option value="ascii">ASCII</option><option value="bold" selected>ASCII, bold highlights</option><option value="lines">Lines &amp; blocks</option></select></div>
    <div class="row"><label for="cell">Cell size</label><input type="range" id="cell" min="4" max="14" step="1" value="6"><output id="cell-o">6</output></div>
    <div class="row"><label for="ripple">3D ripple</label><input type="range" id="ripple" min="0" max="2" step="0.05" value="0.5"><output id="ripple-o">0.50</output></div>
    <div class="btns">
      <button type="button" class="btn" id="hide">Hide controls</button>
      <button type="button" class="btn" id="share">Copy link to this view</button>
      <button type="button" class="btn" id="reset">Reset</button>
    </div>
    <div class="hint">A slow sea drawn in text, rendered live by your GPU and keeping your local time. Nothing here is a video. Press H to hide or show the controls; tap the water to bring them back.</div>
  </div>
</details>
<div class="toast" id="toast" role="status"></div>
